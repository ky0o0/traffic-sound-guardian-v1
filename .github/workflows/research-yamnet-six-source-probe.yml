name: Probe six-class real audio datasets for independent 50-100 recordings each
on:
  push:
    branches: [research/yamnet-six-targets-scale-20261030]
    paths:
      - '.github/workflows/research-yamnet-six-source-probe.yml'
      - 'research/yamnet/scale/probe-trigger.json'
jobs:
  source-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Query actual downloadable HuggingFace file-tree and metadata, without downloading massive corpora
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,collections,io,csv
          UA="TSG-edu-source-probe/1.0 (github.com/ky0o0/traffic-sound-guardian-v1)"
          def fetch(url,maxbytes=4_000_000):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'}),timeout=40) as f:
                  b=f.read(maxbytes+1)
                  if len(b)>maxbytes:raise ValueError('too long')
                  return b
          urls=[
            'https://huggingface.co/api/datasets/Titung/vehicle-audio-dataset/tree/main?limit=1000',
            'https://huggingface.co/api/datasets/Titung/vehicle-audio-dataset/tree/main?recursive=true&limit=1000',
            'https://huggingface.co/api/datasets/Fhrozen/FSD50k/tree/main/labels?limit=100',
            'https://huggingface.co/api/datasets/Fhrozen/FSD50k/tree/main/clips?limit=100',
            'https://api.mendeley.com/public/datasets/j4ydzzv4kb/versions/1',
            'https://huggingface.co/datasets/danavery/urbansound8K/resolve/main/UrbanSound8K.csv'
          ]
          for url in urls:
              try:
                  b=fetch(url)
                  if url.endswith('.csv'):
                      x=list(csv.DictReader(io.StringIO(b.decode('utf-8-sig'))))
                      cat=collections.Counter(row['class'] for row in x)
                      unique=collections.defaultdict(set)
                      for row in x:unique[row['class']].add(row['fsID'])
                      print('URBAN_META',len(x),dict(cat),'unique_freesound',{k:len(v) for k,v in unique.items()})
                      continue
                  j=json.loads(b)
                  if isinstance(j,list):
                      print('LIST',url,'count',len(j),'first',[(x.get('path'),x.get('type'),x.get('size')) for x in j[:18]])
                      print('COUNTS',dict(collections.Counter(y.get('path','').split('/')[0] for y in j)))
                  else:print('DICT',url,'keys',list(j)[:22],'preview',str(j)[:600])
              except Exception as e:
                  print('ERR',url,repr(e))
          PY
