name: SH round 3 controlled continuous study
on:
  push:
    branches: [research/sh-round3-stateful-20261030]
    paths: ['.github/workflows/research-sh-round3-study.yml', 'research/semantic_hearing/round3/study_trigger.json']
permissions:
  contents: read
  actions: read
jobs:
  continuous-study:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '20261030'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.22'
          cache: pip
          cache-dependency-path: research/semantic_hearing/round2/dependency-lock.txt
      - run: python -m pip install -r research/semantic_hearing/round2/dependency-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41021346346
          name: sh-r3-pilot-1664e2d64a6e236bb6cd4d76156c5d2f61c6422a
          path: /tmp/sh-r3-pilot
      - name: Require the ACTUAL pretrained gate and unchanged validated implementation
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('/tmp/sh-r3-pilot')
          assert json.loads((p/'gate.json').read_text())['passed']
          here=Path('research/semantic_hearing/round3')
          assert json.loads((p/'config.json').read_text())==json.loads((here/'config.json').read_text())
          env=json.loads((p/'environment.json').read_text())
          for key,name in [('adapter_sha256','streaming.py'),('model_loader_sha256','model_io.py'),('input_recipe_sha256','data.py'),('runner_sha256','study.py')]:
              assert hashlib.sha256((here/name).read_bytes()).hexdigest()==env[key],name
          print('Real pilot passed, same parameters and same validated inference/input code')
          PY
      - name: Pin official code
        run: |
          git clone --quiet https://github.com/vb000/SemanticHearing.git /tmp/SemanticHearing
          git -C /tmp/SemanticHearing checkout --quiet 07e9786c7a741f0a7c722dcde66a2679ca068c50
      - uses: actions/cache@v4
        with:
          path: /tmp/39.pt
          key: sh-official-39-f0328655691378a65516ec08add170bcf474ba41bb2d475af7a7c63bf2478a21
      - name: Verify checkpoint or fetch only on cache miss
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'research/semantic_hearing')
          from real_audio import fetch_verified
          from extract import OFFICIAL_CHECKPOINT_SHA256
          fetch_verified('https://semantichearing.cs.washington.edu/39.pt',Path('/tmp/39.pt'),OFFICIAL_CHECKPOINT_SHA256)
          PY
      - name: Run six continuous inputs with three state policies and paced file replay
        run: |
          mkdir -p /tmp/sh-r3-full
          set -o pipefail
          python -u research/semantic_hearing/round3/study.py --mode full --semantic-repo /tmp/SemanticHearing --checkpoint /tmp/39.pt --output /tmp/sh-r3-full 2>&1 | tee /tmp/sh-r3-full/execution.log
      - name: Per-event results, per-block timing tables and figures
        run: python research/semantic_hearing/round3/analyze.py --full /tmp/sh-r3-full --pilot /tmp/sh-r3-pilot --output /tmp/sh-r3-full/analysis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sh-r3-continuous-${{ github.sha }}
          path: /tmp/sh-r3-full
          retention-days: 90
          if-no-files-found: error
  verify-and-key-replay:
    needs: continuous-study
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '20261030'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sh-round3-stateful-20261030
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.22'
          cache: pip
          cache-dependency-path: research/semantic_hearing/round2/dependency-lock.txt
      - run: python -m pip install -r research/semantic_hearing/round2/dependency-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Pin official code and verify all numerical and adapter contracts
        env:
          SH_REPO: /tmp/SemanticHearing
        run: |
          git clone --quiet https://github.com/vb000/SemanticHearing.git /tmp/SemanticHearing
          git -C /tmp/SemanticHearing checkout --quiet 07e9786c7a741f0a7c722dcde66a2679ca068c50
          python -m unittest discover -s research/semantic_hearing -p 'test_*.py' -v
          python -m unittest discover -s research/semantic_hearing/round2 -p 'test_*.py' -v
          python -m unittest discover -s research/semantic_hearing/round3 -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: sh-r3-continuous-${{ github.sha }}
          path: /tmp/sh-r3-full
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41021346346
          name: sh-r3-pilot-1664e2d64a6e236bb6cd4d76156c5d2f61c6422a
          path: /tmp/sh-r3-pilot
      - uses: actions/cache@v4
        with:
          path: /tmp/39.pt
          key: sh-official-39-f0328655691378a65516ec08add170bcf474ba41bb2d475af7a7c63bf2478a21
      - name: Verify cached checkpoint
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'research/semantic_hearing')
          from real_audio import fetch_verified
          from extract import OFFICIAL_CHECKPOINT_SHA256
          fetch_verified('https://semantichearing.cs.washington.edu/39.pt',Path('/tmp/39.pt'),OFFICIAL_CHECKPOINT_SHA256)
          PY
      - name: Independent metric, archive, alignment checks and one continuous replay
        run: python -u research/semantic_hearing/round3/verify.py --full /tmp/sh-r3-full --pilot /tmp/sh-r3-pilot --semantic-repo /tmp/SemanticHearing --checkpoint /tmp/39.pt --output research/semantic_hearing/round3/evidence --rerun-output /tmp/sh-r3-independent
      - name: Preserve third-round evidence on its isolated research branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git config user.name 'SH research evidence'
          git config user.email 'research-evidence@users.noreply.github.com'
          git add research/semantic_hearing/round3/evidence
          git commit -m 'research: preserve verified stateful SH quality, timing and independent replay'
          git push origin HEAD:refs/heads/research/sh-round3-stateful-20261030
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sh-r3-independent-replay
          path: /tmp/sh-r3-independent
          retention-days: 90
