name: SH Round 4 real multi-target comparison
on:
  push:
    branches: [research/sh-round4-multiclass-pilot-20261030]
    paths:
      - '.github/workflows/sh-round4-multiclass.yml'
      - 'research/semantic_hearing/round4/trigger.json'
permissions:
  contents: write
jobs:
  real-pretrained-multiclass:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '20261030'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.22'
          cache: pip
          cache-dependency-path: research/semantic_hearing/round2/dependency-lock.txt
      - name: Install pinned Round 2/3 dependencies
        run: python -m pip install -r research/semantic_hearing/round2/dependency-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Verify input, metric, label and scenario construction
        run: python -m unittest discover -s research/semantic_hearing/round4 -p 'test_*.py' -v
      - name: Pin official Semantic Hearing model implementation
        run: |
          git clone --quiet https://github.com/vb000/SemanticHearing.git /tmp/SemanticHearing
          git -C /tmp/SemanticHearing checkout --quiet 07e9786c7a741f0a7c722dcde66a2679ca068c50
          test "$(git -C /tmp/SemanticHearing rev-parse HEAD)" = "07e9786c7a741f0a7c722dcde66a2679ca068c50"
      - uses: actions/cache@v4
        with:
          path: /tmp/39.pt
          key: sh-official-39-f0328655691378a65516ec08add170bcf474ba41bb2d475af7a7c63bf2478a21
      - name: Fetch original 39.pt only when absent and strictly verify SHA-256
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'research/semantic_hearing')
          from real_audio import fetch_verified
          from extract import OFFICIAL_CHECKPOINT_SHA256
          fetch_verified('https://semantichearing.cs.washington.edu/39.pt',Path('/tmp/39.pt'),OFFICIAL_CHECKPOINT_SHA256)
          print('Verified official 39.pt')
          PY
      - name: Actual pretrained multi-hot/interface gate on real recorded material
        run: |
          mkdir -p /tmp/sh-r4-gate
          set -o pipefail
          python -u research/semantic_hearing/round4/pilot.py \
            --semantic-repo /tmp/SemanticHearing --checkpoint /tmp/39.pt \
            --output /tmp/sh-r4-gate --phase gate 2>&1 | tee /tmp/sh-r4-gate/execution.log
      - name: Actual pretrained controlled comparisons (only after gate passes)
        run: |
          mkdir -p /tmp/sh-r4-study
          set -o pipefail
          python -u research/semantic_hearing/round4/pilot.py \
            --semantic-repo /tmp/SemanticHearing --checkpoint /tmp/39.pt \
            --output /tmp/sh-r4-study --phase study 2>&1 | tee /tmp/sh-r4-study/execution.log
      - name: Generate factual Chinese report and preserve compact evidence
        run: |
          python research/semantic_hearing/round4/generate_report.py \
            --gate /tmp/sh-r4-gate --study /tmp/sh-r4-study \
            --output research/semantic_hearing/round4/REPORT.zh-CN.md
          cp /tmp/sh-r4-gate/preflight.json research/semantic_hearing/round4/gate_preflight.json
          cp /tmp/sh-r4-study/summary.json research/semantic_hearing/round4/results_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/semantic_hearing/round4')
          checks=json.loads((root/'gate_preflight.json').read_text())
          summary=json.loads((root/'results_summary.json').read_text())
          assert checks['finite'] and checks['numerical_equivalence']
          assert summary['cases']==12
          print('Evidence and 12 actual-case results preserved; no automatic classification claim')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sh-round4-multitarget-${{ github.sha }}
          path: |
            /tmp/sh-r4-gate
            /tmp/sh-r4-study
          if-no-files-found: warn
          retention-days: 90
      - name: Commit verified compact results to isolated research branch
        if: success()
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'SH research evidence'
          git config user.email 'research-evidence@users.noreply.github.com'
          git add research/semantic_hearing/round4/REPORT.zh-CN.md research/semantic_hearing/round4/gate_preflight.json research/semantic_hearing/round4/results_summary.json
          git commit -m 'research: retain real-model multi-target comparison and report'
          git push origin HEAD:refs/heads/research/sh-round4-multiclass-pilot-20261030
