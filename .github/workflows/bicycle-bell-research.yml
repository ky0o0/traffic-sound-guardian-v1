name: Bicycle bell research (isolated CPU experiment)
on:
  push:
    branches: [research/bicycle-bell-transfer-20261102]
    paths:
      - research/bicycle-bell/*.py
      - research/bicycle-bell/requirements.txt
      - research/bicycle-bell/protocol.json
      - .github/workflows/bicycle-bell-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BELL_RESULTS: bell-results
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independent runner can read licensed FSD50K audio
        run: python research/bicycle-bell/preflight.py
      - name: Install pinned CPU experiment dependencies
        run: python -m pip install -r research/bicycle-bell/requirements.txt
      - name: Check numerical helpers against production resampling
        run: python -m unittest discover -s research/bicycle-bell -p test_experiment.py -v
      - name: Cache public licensed audio for bounded retries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bell-cache
          key: bell-fsd-v1-${{ hashFiles('research/bicycle-bell/protocol.json', 'yamnet.tflite') }}
      - name: Actually train and run the locked independent test
        run: python -u research/bicycle-bell/experiment.py --out "$BELL_RESULTS" --cache "$RUNNER_TEMP/bell-cache"
      - name: Preserve actual trained models, manifests, metrics and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bicycle-bell-research-${{ github.run_id }}
          path: ${{ env.BELL_RESULTS }}
          retention-days: 90
