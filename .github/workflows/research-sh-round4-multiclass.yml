name: SH round 4 multiclass real-audio study
on:
  push:
    branches: [research/sh-round4-multiclass-20261030]
    paths:
      - '.github/workflows/research-sh-round4-multiclass.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  multi-target:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONHASHSEED: '20261030'
      SH_REPO: /tmp/SemanticHearing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.22'
          cache: pip
          cache-dependency-path: research/semantic_hearing/round2/dependency-lock.txt
      - name: Pin full previous experiment dependencies
        run: python -m pip install -r research/semantic_hearing/round2/dependency-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Obtain immutable original model source
        run: |
          git clone --quiet https://github.com/vb000/SemanticHearing.git /tmp/SemanticHearing
          git -C /tmp/SemanticHearing checkout --quiet 07e9786c7a741f0a7c722dcde66a2679ca068c50
          test "$(git -C /tmp/SemanticHearing rev-parse HEAD)" = "07e9786c7a741f0a7c722dcde66a2679ca068c50"
      - name: Protocol tests - no pretrained performance claim
        run: |
          python -m unittest discover -s research/semantic_hearing/round4 -p 'test_*.py' -v
          python -m unittest discover -s research/semantic_hearing/round3 -p 'test_*.py' -v
      - uses: actions/cache@v4
        with:
          path: /tmp/39.pt
          key: sh-official-39-f0328655691378a65516ec08add170bcf474ba41bb2d475af7a7c63bf2478a21
      - name: Obtain verified original 39.pt checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'research/semantic_hearing')
          from real_audio import fetch_verified
          from extract import OFFICIAL_CHECKPOINT_SHA256
          fetch_verified('https://semantichearing.cs.washington.edu/39.pt',Path('/tmp/39.pt'),OFFICIAL_CHECKPOINT_SHA256)
          print('Verified pinned original weights',OFFICIAL_CHECKPOINT_SHA256)
          PY
      - name: Execute REAL pretrained multi-target cases, preserve both failure and success
        run: |
          mkdir -p /tmp/sh-r4-run
          set -o pipefail
          python -u research/semantic_hearing/round4/study.py \
            --semantic-repo /tmp/SemanticHearing --checkpoint /tmp/39.pt \
            --output /tmp/sh-r4-run --evidence research/semantic_hearing/round4/evidence \
            2>&1 | tee /tmp/sh-r4-run/execution.log
      - name: Independently check output and frozen source manifests
        run: |
          python - <<'PY'
          import json, numpy as np, soundfile as sf
          from pathlib import Path
          d=Path('/tmp/sh-r4-run')
          r=json.loads((d/'results.json').read_text())
          assert len(r['results']) == 6
          assert r['gate']['multihot_stream_vs_offline_max_abs_difference'] < 5e-5
          for row in r['results']:
              name=row['plan']['id'];folder=d/'wavs'/name
              for stem in ('input','horn_reference','siren_reference','horn_only','siren_only','two_hot','two_pass_sum'):
                  a,sr=sf.read(folder/(stem+'.wav'),always_2d=True,dtype='float32')
                  assert sr==44100 and a.shape==(352800,2) and np.isfinite(a).all(),(name,stem)
              a=sf.read(folder/'horn_only.wav',always_2d=True,dtype='float32')[0]
              b=sf.read(folder/'siren_only.wav',always_2d=True,dtype='float32')[0]
              c=sf.read(folder/'two_pass_sum.wav',always_2d=True,dtype='float32')[0]
              assert np.max(np.abs((a+b)-c))<1e-6
          assert (Path('research/semantic_hearing/round4/evidence')/'REPORT.zh-CN.md').is_file()
          print('Verified all 6 mixtures, all original and output waveforms, unmodified two-pass sum')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sh-r4-all-wavs-${{ github.sha }}
          path: /tmp/sh-r4-run
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve actual fourth-round evidence ONLY in research branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git config user.name "SH research evidence"
          git config user.email "research-evidence@users.noreply.github.com"
          git add research/semantic_hearing/round4/evidence
          git commit -m 'research: save pretrained SH multiclass comparison results and listening evidence'
          git push origin HEAD:refs/heads/research/sh-round4-multiclass-20261030
