name: Probe FSD50K bell and siren subtype dataset without re-downloading recordings
on:
  push:
    branches: [research/yamnet-six-targets-scale-20261030]
    paths:
      - '.github/workflows/research-yamnet-six-bell-source-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect FSD50K 200-class AudioSet labels and list bell original files
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,csv,io,collections,json
          ua='TSG-Research-SourceProbe/1.0 (ky0o0/traffic-sound-guardian-v1)'
          def get(u,cap=6_000_000):
              with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':ua}),timeout=35) as r:return r.read(cap)
          base='https://huggingface.co/datasets/Fhrozen/FSD50k/resolve/main/'
          for f in ['labels/vocabulary.csv','labels/eval.csv','labels/dev.csv']:
              try:
                  raw=get(base+f)
                  rows=list(csv.reader(io.StringIO(raw.decode('utf-8-sig'))))
                  print('FILE',f,'rows',len(rows),'FIRST',rows[:4])
                  if f.endswith('vocabulary.csv'):
                      print('VOCAB_RELEVANT',[(i,z) for i,z in enumerate(rows) if any(x in str(z).lower() for x in ['bell','siren','horn','police','ambulance','fire'])])
                  else:
                      labels=collections.Counter()
                      for row in rows[1:]:
                          if len(row)>1:
                              for label in row[1].split(','):labels[label]+=1
                      print('COUNTS',[(k,v) for k,v in labels.most_common() if any(x in k.lower() for x in ['bell','siren','horn','police','ambulance','fire'])][:60])
              except Exception as e:print('ERROR',f,repr(e))
          for f in ['clips/eval','clips/dev']:
              u='https://huggingface.co/api/datasets/Fhrozen/FSD50k/tree/main/'+f+'?limit=12'
              try:
                  x=json.loads(get(u))
                  print('DIR',f,len(x),[(y.get('path'),y.get('type')) for y in x[:12]])
              except Exception as e:print('ERROR_DIR',f,repr(e))
          for u in [
             'https://datasets-server.huggingface.co/first-rows?dataset=Titung/vehicle-audio-dataset&config=default&split=train',
             'https://huggingface.co/api/datasets/Titung/vehicle-audio-dataset/parquet'
          ]:
              try:
                  b=get(u,2_000_000)
                  x=json.loads(b)
                  print('TITUNGAPI',u,list(x)[:12],str(x)[:1500])
              except Exception as e:print('TITUNG_ERROR',u,repr(e))
          PY
